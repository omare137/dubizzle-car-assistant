[project]
name = "dubizzle-car-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "fastembed>=0.4.2",
    "litellm>=1.92.0",
    "numpy>=2.4.6",
    "onnxruntime==1.19.2",
    "openpyxl>=3.1.5",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
markers = [
    "integration: live end-to-end tests that hit the real LLM; excluded by default, run with -m integration",
]
# Integration tests cost tokens and need the API key — opt in explicitly.
addopts = "-m 'not integration'"
